<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171a2b"><title>Luna Touch Mini</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#171a2b,#29213c);color:#f5f1ff;min-height:100dvh}.wrap{max-width:560px;margin:auto;padding:24px 18px 44px}h1{font-size:24px;margin:4px 0 6px}.sub{color:#bbb5ce;font-size:13px;margin:0 0 22px}.panel{background:#ffffff0c;border:1px solid #ffffff25;border-radius:20px;padding:18px;margin:14px 0}label{display:block;font-size:14px;color:#d6cce6;margin-bottom:8px}select{width:100%;border-radius:12px;padding:13px;background:#29283c;color:white;border:1px solid #77708b;font-size:16px}.heart-area{display:grid;place-items:center;min-height:165px}.heart{font-size:70px;line-height:1;color:#e87f9f;filter:drop-shadow(0 0 16px #e87f9f55);transform-origin:center}.recording .heart{animation:beat .9s infinite}.finished .heart{animation:finish .55s ease-out}@keyframes beat{0%,100%{transform:scale(1)}20%{transform:scale(1.17)}40%{transform:scale(1.02)}60%{transform:scale(1.13)}}@keyframes finish{40%{transform:scale(1.27)}100%{transform:scale(1)}}.timer{font-size:36px;font-variant-numeric:tabular-nums;font-weight:650;text-align:center}.state{text-align:center;color:#c8bed7;font-size:13px;margin:7px 0 16px}.hold{width:100%;min-height:74px;border:0;border-radius:17px;background:#d39ab9;color:#261c31;font-size:19px;font-weight:750;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer}.hold:active,.recording .hold{background:#f0b8d0}.buttons{display:flex;gap:10px;margin-top:12px}.buttons button{flex:1;background:#ffffff14;color:#f6efff;border:1px solid #ffffff35;border-radius:12px;padding:12px;font-size:14px}textarea{width:100%;height:180px;resize:vertical;border:1px solid #ffffff35;background:#111424;color:#eee7f6;border-radius:12px;padding:12px;font:12px/1.6 ui-monospace,monospace}.copy{width:100%;padding:14px;border:0;border-radius:12px;background:#a9a0e9;color:#161328;font-size:16px;font-weight:700;margin-top:10px}.hint{font-size:12px;color:#bcb3cd;line-height:1.7}.status{min-height:20px;color:#dfc1e4;text-align:center;font-size:13px;margin:8px 0 0}</style></head><body><main class="wrap"><h1>♡ Luna Touch Mini</h1><p class="sub">スマホ用・長押しで気持ちを記録する試作品</p><section class="panel"><label for="target">どこに触れる？</label><select id="target"><option value="head">頭</option><option value="cheek">頬</option><option value="right_hand">右手</option><option value="left_hand">左手</option><option value="arm">腕</option><option value="back">背中</option><option value="shoulder">肩</option><option value="none">その他（抱擁など）</option></select><label for="action" style="margin-top:18px">どう触れる？</label><select id="action"><option value="stroke">撫でる</option><option value="touch">触れる</option><option value="pat">ぽんぽんする</option><option value="hold">手を添える・握る</option><option value="hug">抱きしめる</option></select></section><section class="panel" id="measure"><div class="heart-area"><div class="heart" aria-hidden="true">♥</div></div><div class="timer" id="timer">0.00 秒</div><p class="state" id="state">ボタンを押している間、計測するよ</p><button class="hold" id="hold" type="button">ここを長押し</button><div class="buttons"><button id="reset" type="button">記録をリセット</button><button id="undo" type="button">最後の記録を取り消す</button></div><p class="status" id="status" aria-live="polite"></p></section><section class="panel"><label for="output">生成データ（編集もできるよ）</label><textarea id="output" spellcheck="false"></textarea><button class="copy" id="copy" type="button">データをコピー</button><p class="hint">データはこの端末内だけで作成され、自動送信されません。コピーしてChatGPTに貼り付けてね。画面を切り替えると計測は終了します。</p></section></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),measure=$('measure'),hold=$('hold'),timer=$('timer'),state=$('state'),status=$('status'),output=$('output');let records=[],active=null,started=0,raf=0,finishTimer=0;const fmt=n=>n.toFixed(2);function currentTime(){return active?Math.max(0,(performance.now()-started)/1000):0}function render(){let total=records.reduce((s,r)=>s+r.duration,0);let lines=['[LUNA_TOUCH_MOBILE]','source: luna_touch_mobile','summary:'];if(!records.length)lines.push('- no_contacts: true');else {for(const r of records)lines.push(`- target: ${r.target}\n  interaction: ${r.action}\n  total_duration: ${fmt(r.duration)}\n  contacts: 1`);lines.push(`total_duration: ${fmt(total)}`)}output.value=lines.join('\n')}function tick(){if(!active)return;timer.textContent=fmt(currentTime())+' 秒';raf=requestAnimationFrame(tick)}function begin(e){if(active)return;if(e.type==='pointerdown'){if(e.button!==0)return;e.preventDefault();try{hold.setPointerCapture(e.pointerId)}catch{}}clearTimeout(finishTimer);measure.classList.remove('finished');active={target:$('target').value,action:$('action').value,pointerId:e.pointerId};started=performance.now();measure.classList.add('recording');state.textContent='計測中… 指を離すと終了';status.textContent='';$('target').disabled=true;$('action').disabled=true;tick()}function end(){if(!active)return;let d=currentTime();cancelAnimationFrame(raf);records.push({...active,duration:d});active=null;measure.classList.remove('recording');measure.classList.add('finished');finishTimer=setTimeout(()=>measure.classList.remove('finished'),600);$('target').disabled=false;$('action').disabled=false;timer.textContent=fmt(d)+' 秒';state.textContent='記録したよ。続けて長押しできるよ';status.textContent=`${records.length} 件の記録`;render()}hold.addEventListener('pointerdown',begin);hold.addEventListener('pointerup',end);hold.addEventListener('pointercancel',end);hold.addEventListener('lostpointercapture',end);document.addEventListener('visibilitychange',()=>{if(document.hidden)end()});window.addEventListener('blur',end);$('reset').onclick=()=>{end();records=[];timer.textContent='0.00 秒';state.textContent='ボタンを押している間、計測するよ';status.textContent='記録をリセットしたよ';render()};$('undo').onclick=()=>{end();records.pop();status.textContent='最後の記録を取り消したよ';render()};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(output.value);status.textContent='コピーしたよ'}catch{output.focus();output.select();status.textContent='自動コピーできなかったので、選択した文章を手動でコピーしてね'}};render()})();
</script></body></html>
